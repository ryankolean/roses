name: Build and deploy

# The pitch is that the restaurant edits one text file and the site updates.
# This is what makes that true: edit content/menu.md on github.com, commit, and
# the menu pages plus the Menu JSON-LD are regenerated and the site republished.
#
# Deploying from Actions rather than from the branch matters. A commit pushed
# by GITHUB_TOKEN does not trigger the branch-based Pages build, so a
# commit-back approach would silently never publish.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site settings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Render content/menu.md and content/drinks.md into the pages
        run: python3 tools/build_menu.py

      - name: Fail if the committed pages were stale
        run: |
          if ! git diff --quiet; then
            echo "::warning::content/menu.md or content/drinks.md was ahead of the committed HTML. Deploying the regenerated pages."
            git --no-pager diff --stat
          fi

      - name: Stage the public files into _site
        run: python3 tools/build_site.py

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
