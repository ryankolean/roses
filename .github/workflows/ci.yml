name: ci

# Summit framework gate (SUMMIT-253 Level 1): public facts only, menu pages in
# sync with content/menu.md, and the built pages pass the preview checks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # @summit/cli 0.2.0 (tag cli-v0.2.0), pinned by commit, fetched over HTTPS
      - name: Install summit
        run: npm install --global --no-fund --no-audit https://codeload.github.com/ryankolean/summit-components/tar.gz/49936982af8826b87021c3a991581610b4d41dec # zizmor: ignore[adhoc-packages] pinned to an immutable commit

      - name: No private intake committed
        run: summit verify-split .

      # Pull requests only: an owner edit to content/menu.md committed straight
      # to main is regenerated by the deploy workflow, so it must not fail here.
      - name: Menu pages match content/menu.md
        if: github.event_name == 'pull_request'
        run: python3 tools/build_menu.py && git diff --exit-code

      - name: Stage _site
        run: python3 tools/build_site.py

      - name: Preview checks
        run: summit check gate _site --mode preview --base /roses/

      # Proves the launch build would pass: noindex off, concept pages out,
      # URLs on the real domain. Nothing from this build is published.
      - name: Launch dry run
        run: |
          SITE_MODE=production SITE_URL=https://rosesdetroit.com/ python3 tools/build_site.py
          summit check gate _site --mode production
